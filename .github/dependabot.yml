version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      # One PR for all semver-compatible updates; major versions get their own.
      cargo-compatible:
        update-types:
          - minor
          - patch
    ignore:
      # magnet-url 3 keeps only the last xt= of a magnet, so on hybrid v1+v2
      # magnets it returns the btmh hash and loses the btih that put.io
      # reports (see #48). Stay on 2.x.
      - dependency-name: magnet-url
        update-types:
          - version-update:semver-major

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directory: /docker
    schedule:
      interval: weekly
